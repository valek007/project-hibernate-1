<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>RPG</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link th:href="@{/css/my.css}" href="../css/my.css" rel="stylesheet">
</head>
<body onload="showList(0)">
<div class="container">
    <h1>RPG admin panel</h1>
    <h2>Accounts list:</h2>

    <div class="controls">
        <div class="left">
            <label for="count_1">Count per page:</label>
            <select name="count_1" id="count_1" onchange="showList(0)">
                <option value="3">3</option>
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
            </select>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="table_all" id="table_1">
            <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Title</th>
                <th>Race</th>
                <th>Profession</th>
                <th>Level</th>
                <th>Birthday</th>
                <th>Banned</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody id="table_body"></tbody>
        </table>
    </div>

    <div id="paging_buttons">Pages:</div>

    <hr>
    <h2>Create new account:</h2>
    <div class="create">
        <div class="create__group">
            <label class="create__label" for="input_name_new">Name:</label>
            <input class="create__input" type="text" id="input_name_new" name="name" required maxlength="12">
        </div>
        <div class="create__group">
            <label class="create__label" for="input_title_new">Title:</label>
            <input class="create__input" type="text" id="input_title_new" title="name" required maxlength="30">
        </div>
        <div class="create__group">
            <label class="create__label" for="input_race_new">Race:</label>
            <select class="create__select" id="input_race_new" name='race'>
                <option value='HUMAN'>HUMAN</option>
                <option value='DWARF'>DWARF</option>
                <option value='ELF'>ELF</option>
                <option value='GIANT'>GIANT</option>
                <option value='ORC'>ORC</option>
                <option value='TROLL'>TROLL</option>
                <option value='HOBBIT'>HOBBIT</option>
            </select>
        </div>
        <div class="create__group">
            <label class="create__label" for="input_profession_new">Profession:</label>
            <select class="create__select" id="input_profession_new" name='profession'>
                <option value='WARRIOR'>WARRIOR</option>
                <option value='ROGUE'>ROGUE</option>
                <option value='SORCERER'>SORCERER</option>
                <option value='CLERIC'>CLERIC</option>
                <option value='PALADIN'>PALADIN</option>
                <option value='NAZGUL'>NAZGUL</option>
                <option value='WARLOCK'>WARLOCK</option>
                <option value='DRUID'>DRUID</option>
            </select>
        </div>
        <div class="create__group">
            <label class="create__label" for="input_level_new">Level:</label>
            <input class="create__input" type="number" id="input_level_new" name="level" min="0" max="100">
        </div>
        <div class="create__group">
            <label class="create__label" for="input_birthday_new">Birthday:</label>
            <input class="create__input" type="date" id="input_birthday_new" name="birthday" min="2000-01-01" max="3000-12-31">
        </div>
        <div class="create__group">
            <label class="create__label" for="input_banned_new">Banned:</label>
            <select class="create__select" id="input_banned_new" name='banned'>
                <option value='false'>false</option>
                <option value='true'>true</option>
            </select>
        </div>
        <div class="create__group">
            <span>
                <button type="button" class="btn-primary" onclick='createAcc()'>
                    <img th:src="@{/img/save.png}" src="../img/save.png" alt="" class="img_save">
                </button>
            </span>
        </div>
    </div>

</div>

<!-- Thymeleaf will replace these with context-aware paths -->
<script th:inline="javascript">
    var REST_PLAYERS = /*[[ @{/rest/players} ]]*/ '../rest/players';
    var REST_PLAYERS_COUNT = /*[[ @{/rest/players/count} ]]*/ '../rest/players/count';
    var IMG_PATH = /*[[ @{/img/} ]]*/ '../img/';
/*<![CDATA[*/
</script>

<script>
    function showList(page_number) {
        let url = REST_PLAYERS + "?";
        let countPerPage = $("#count_1").val() || 3;
        url = url + "pageSize=" + countPerPage;
        if (page_number !== null) url += "&pageNumber=" + page_number;

        $.get(url, function (response) {
            $("#table_body").empty();
            $.each(response, function (i, item) {
                $("<tr>").html(
                    "<td>" + item.id + "</td>" +
                    "<td>" + item.name + "</td>" +
                    "<td>" + item.title + "</td>" +
                    "<td>" + item.race + "</td>" +
                    "<td>" + item.profession + "</td>" +
                    "<td>" + item.level + "</td>" +
                    "<td>" + new Date(item.birthday).toLocaleDateString() + "</td>" +
                    "<td>" + item.banned + "</td>" +
                    "<td><button id='button_edit_" + item.id + "' onclick='editAcc(" + item.id + ")'><img src='" + IMG_PATH + "edit.png' class='img_edit'></button></td>" +
                    "<td><button id='button_delete_" + item.id + "' onclick='deleteAcc(" + item.id + ")'><img src='" + IMG_PATH + "delete.png' class='img_delete'></button></td>"
                ).appendTo('#table_body');
            });
        }).fail(function(){});

        let totalCount = getTotalCount();
        let pagesCount = Math.ceil(totalCount / countPerPage);

        $("button.pgn-bnt-styled").remove();
        for (let i = 0; i < pagesCount; i++) {
            let btn = $("<button>").text(i + 1).attr('id', "paging_button_" + i).data('page', i).addClass('pgn-bnt-styled')
                .on('click', function () { let page = $(this).data('page'); showList(page); $(this).addClass('active').siblings('.pgn-bnt-styled').removeClass('active'); });
            $('#paging_buttons').append(btn);
        }

        if (page_number !== null) $("#paging_button_" + page_number).addClass('active'); else $("#paging_button_0").addClass('active');
    }

    function getTotalCount() {
        let value = 1;
        $.ajax({ url: REST_PLAYERS_COUNT, async: false, success: function (result) { value = result; } });
        return parseInt(value);
    }

    function deleteAcc(id) {
        $.ajax({ url: REST_PLAYERS + "/" + id, type: 'DELETE', success: function () { showList(getCurrentPage()); } });
    }

    function editAcc(id) {
        let btnEdit = "#button_edit_" + id, btnDel = "#button_delete_" + id;
        $(btnDel).remove();
        $(btnEdit).html("<img src='" + IMG_PATH + "save.png' class='img_save'>").attr('onclick', 'saveAcc(' + id + ')');
        let tr = $(btnEdit).closest('tr'), tds = tr.children();
        tds.eq(1).html("<input id='input_name_" + id + "' type='text' value='" + tds.eq(1).text() + "'>");
        tds.eq(2).html("<input id='input_title_" + id + "' type='text' value='" + tds.eq(2).text() + "'>");
        tds.eq(3).html(getDropdownRaceHtml(id)); $("#select_race_"+id).val(tds.eq(3).text());
        tds.eq(4).html(getDropdownProfessionHtml(id)); $("#select_profession_"+id).val(tds.eq(4).text());
        tds.eq(7).html(getDropdownBannedHtml(id)); $("#select_banned_"+id).val(tds.eq(7).text());
    }

    function saveAcc(id) {
        let payload = { name: $("#input_name_"+id).val(), title: $("#input_title_"+id).val(), race: $("#select_race_"+id).val(), profession: $("#select_profession_"+id).val(), banned: $("#select_banned_"+id).val() };
        $.ajax({ url: REST_PLAYERS + "/" + id, type: 'POST', dataType: 'json', contentType: 'application/json;charset=UTF-8', async: false, data: JSON.stringify(payload), success: function () { showList(getCurrentPage()); } });
    }

    function createAcc() {
        let datetime = new Date($("#input_birthday_new").val()).getTime();
        let payload = { name: $("#input_name_new").val(), title: $("#input_title_new").val(), race: $("#input_race_new").val(), profession: $("#input_profession_new").val(), level: $("#input_level_new").val(), birthday: datetime, banned: $("#input_banned_new").val() };
        let url = REST_PLAYERS;
        $.ajax({ url: url, type: 'POST', dataType: 'json', contentType: 'application/json;charset=UTF-8', async: false, data: JSON.stringify(payload), success: function () { $("#input_name_new,#input_title_new,#input_level_new,#input_birthday_new").val(""); showList(getCurrentPage()); } });
        return false;
    }

    function getCurrentPage() {
        let active = $(".pgn-bnt-styled.active");
        return active.length ? parseInt(active.text()) - 1 : 0;
    }

    function getDropdownRaceHtml(id) { return "<select id='select_race_" + id + "' name='race'><option value='HUMAN'>HUMAN</option><option value='DWARF'>DWARF</option><option value='ELF'>ELF</option><option value='GIANT'>GIANT</option><option value='ORC'>ORC</option><option value='TROLL'>TROLL</option><option value='HOBBIT'>HOBBIT</option></select>"; }
    function getDropdownProfessionHtml(id) { return "<select id='select_profession_" + id + "' name='profession'><option value='WARRIOR'>WARRIOR</option><option value='ROGUE'>ROGUE</option><option value='SORCERER'>SORCERER</option><option value='CLERIC'>CLERIC</option><option value='PALADIN'>PALADIN</option><option value='NAZGUL'>NAZGUL</option><option value='WARLOCK'>WARLOCK</option><option value='DRUID'>DRUID</option></select>"; }
    function getDropdownBannedHtml(id) { return "<select id='select_banned_" + id + "' name='banned'><option value='false'>false</option><option value='true'>true</option></select>"; }

/*]]>*/
</script>
</body>
</html>
